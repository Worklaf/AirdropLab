<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Колесо Фортуны — AirdropLab</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CENTRALIZED AUTHENTICATION SYSTEM -->
  <script src="auth.js"></script>
  <script src="auth-modal.js"></script>
  
  <link rel="stylesheet" href="styles.css">
  <script src="languages.js"></script>
  <script src="header.js"></script>
  <script src="firebase-config.js"></script>
  <script src="assets/reagents.js"></script>
  
  <style>
    .wheel-container {
      position: relative;
      display: inline-block;
    }
    
    .wheel {
      border-radius: 50%;
      border: 8px solid #1e293b;
      box-shadow: 0 0 30px rgba(34, 211, 238, 0.3);
    }
    
    .pointer {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 40px solid #ef4444;
      z-index: 10;
    }
    
    .spin-button {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(34, 211, 238, 0.4);
    }
    
    .spin-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(34, 211, 238, 0.6);
    }
    
    .spin-button:disabled {
      background: #64748b;
      cursor: not-allowed;
      transform: none;
    }
    
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal-content {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid rgba(34, 211, 238, 0.3);
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    }
    
    .jackpot-pot {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .stat-card {
      background: rgba(30, 37, 56, 0.6);
      border: 1px solid rgba(34, 211, 238, 0.2);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: #22d3ee;
    }
    
    .stat-label {
      color: #64748b;
      margin-top: 5px;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <!-- Header -->
  <header id="site-header" class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="container mx-auto px-4 py-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4">
          <a href="index.html" class="flex items-center space-x-2">
            <img src="assets/logo.svg" alt="AirdropLab" class="h-8 w-8">
            <span class="text-xl font-bold text-cyan-400">AirdropLab</span>
          </a>
          <nav class="hidden md:flex space-x-6">
            <a href="index.html" class="text-slate-300 hover:text-cyan-400 transition">Главная</a>
            <a href="faucet.html" class="text-slate-300 hover:text-cyan-400 transition">Краны</a>
            <a href="wheel-of-fortune.html" class="text-cyan-400 font-semibold">Колесо</a>
          </nav>
        </div>
        
        <div class="flex items-center space-x-4">
          <!-- Уведомления -->
          <button onclick="typeof showNotifications==='function'&&showNotifications()" class="relative p-2 text-slate-400 hover:text-cyan-400 transition">
            <i class="fas fa-bell text-lg"></i>
            <span id="notificationBadge" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-xs flex items-center justify-center hidden">0</span>
          </button>
          
          <!-- Профиль -->
          <div id="userProfile" class="flex items-center space-x-3">
            <button id="loginBtn" onclick="typeof openLoginModal==='function'&&openLoginModal()" class="bg-cyan-600 hover:bg-cyan-700 px-4 py-2 rounded-lg transition">
              <i class="fas fa-sign-in-alt mr-2"></i>Войти
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-8">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold mb-4 bg-gradient-to-r from-cyan-400 to-blue-600 bg-clip-text text-transparent">
        Колесо Фортуны
      </h1>
      <p class="text-slate-400 text-lg">Крутите колесо и выигрывайте RGT жетоны!</p>
    </div>

    <!-- Джекпот -->
    <div class="jackpot-pot mb-8">
      <div class="text-sm opacity-80 mb-2">💰 Текущий Джекпот</div>
      <div id="jackpotAmount" class="text-3xl">0 RGT</div>
      <div class="text-sm opacity-80 mt-2">Следующий розыгрыш через: <span id="jackpotTimer">--:--:--</span></div>
    </div>

    <!-- Колесо -->
    <div class="flex flex-col items-center mb-8">
      <div class="wheel-container mb-6">
        <div class="pointer"></div>
        <canvas id="wheel" class="wheel" width="400" height="400"></canvas>
      </div>
      
      <button id="spinButton" onclick="doSpin()" class="spin-button" disabled>
        <i class="fas fa-sync-alt mr-2"></i>Крутить колесо
      </button>
    </div>

    <!-- Статистика -->
    <div class="stats-grid">
      <div class="stat-card">
        <div id="totalSpins" class="stat-value">0</div>
        <div class="stat-label">Всего вращений</div>
      </div>
      <div class="stat-card">
        <div id="yourSpins" class="stat-value">0</div>
        <div class="stat-label">Ваши вращения</div>
      </div>
      <div class="stat-card">
        <div id="totalWinnings" class="stat-value">0</div>
        <div class="stat-label">Общий выигрыш</div>
      </div>
      <div class="stat-card">
        <div id="yourWinnings" class="stat-value">0</div>
        <div class="stat-label">Ваш выигрыш</div>
      </div>
    </div>

    <!-- История -->
    <div class="mt-12">
      <h2 class="text-2xl font-bold mb-6 text-center">История вращений</h2>
      <div id="historyList" class="space-y-3">
        <div class="text-center text-slate-500">Загрузка истории...</div>
      </div>
    </div>
  </main>

  <!-- Модальное окно результата -->
  <div id="resultModal" class="modal" style="display: none;">
    <div class="modal-content text-center">
      <h2 class="text-2xl font-bold mb-4">🎉 Поздравляем!</h2>
      <div id="resultMessage" class="text-lg mb-6"></div>
      <button onclick="closeResultModal()" class="bg-cyan-600 hover:bg-cyan-700 px-6 py-2 rounded-lg transition">
        Закрыть
      </button>
    </div>
  </div>

  <script>
    // Глобальные переменные
    let spinning = false;
    let currentRotation = 0;
    let wheelSegments = [];
    let jackpotData = null;
    let currentUser = null;
    let auth = null;
    let db = null;

    // Инициализация при загрузке
    document.addEventListener('DOMContentLoaded', function() {
      initializeWheel();
      
      // Ждем загрузки Firebase
      setTimeout(function() {
        if (typeof window.auth !== 'undefined') {
          auth = window.auth;
          db = window.db;
          currentUser = window.currentUser;
          
          // Загружаем данные
          loadJackpot();
          loadStats();
          loadHistory();
          
          // Загружаем уведомления
          if (currentUser && db && typeof window.loadNotifications === 'function') {
            window.loadNotifications();
          }
          
          // Обновляем UI
          updateAuthUI();
        }
      }, 1000);
    });

    // Обновление UI при авторизации
    function updateAuthUI() {
      const loginBtn = document.getElementById('loginBtn');
      const spinButton = document.getElementById('spinButton');
      const userProfile = document.getElementById('userProfile');
      
      if (currentUser) {
        spinButton.disabled = false;
        if (loginBtn) loginBtn.style.display = 'none';
        
        // Показываем информацию о пользователе
        if (userProfile) {
          userProfile.innerHTML = `
            <div class="flex items-center space-x-3">
              <div class="w-8 h-8 bg-cyan-600 rounded-full flex items-center justify-center">
                <i class="fas fa-user text-sm"></i>
              </div>
              <span class="text-sm">${currentUser.email || currentUser.displayName || 'User'}</span>
              <button onclick="typeof logout==='function'&&logout()" class="text-red-400 hover:text-red-300">
                <i class="fas fa-sign-out-alt"></i>
              </button>
            </div>
          `;
        }
      } else {
        spinButton.disabled = true;
        if (loginBtn) loginBtn.style.display = 'block';
        if (userProfile) {
          userProfile.innerHTML = `
            <button id="loginBtn" onclick="typeof openLoginModal==='function'&&openLoginModal()" class="bg-cyan-600 hover:bg-cyan-700 px-4 py-2 rounded-lg transition">
              <i class="fas fa-sign-in-alt mr-2"></i>Войти
            </button>
          `;
        }
      }
    }

    // Инициализация колеса
    function initializeWheel() {
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      
      // Сегменты колеса
      wheelSegments = [
        { label: '10 RGT', value: 10, color: '#ef4444' },
        { label: '5 RGT', value: 5, color: '#f59e0b' },
        { label: '20 RGT', value: 20, color: '#10b981' },
        { label: '1 RGT', value: 1, color: '#3b82f6' },
        { label: '50 RGT', value: 50, color: '#8b5cf6' },
        { label: '再次旋转', value: 0, color: '#ec4899' },
        { label: '15 RGT', value: 15, color: '#14b8a6' },
        { label: '100 RGT', value: 100, color: '#f97316' }
      ];
      
      drawWheel();
    }

    // Отрисовка колеса
    function drawWheel() {
      const canvas = document.getElementById('wheel');
      const ctx = canvas.getContext('2d');
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 180;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const anglePerSegment = (Math.PI * 2) / wheelSegments.length;
      
      wheelSegments.forEach((segment, index) => {
        const startAngle = index * anglePerSegment + currentRotation;
        const endAngle = startAngle + anglePerSegment;
        
        // Рисуем сегмент
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = segment.color;
        ctx.fill();
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // Рисуем текст
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + anglePerSegment / 2);
        ctx.textAlign = 'center';
        ctx.fillStyle = 'white';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(segment.label, radius / 2, 0);
        ctx.restore();
      });
      
      // Рисуем центр
      ctx.beginPath();
      ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
    }

    // Вращение колеса
    async function doSpin() {
      if (spinning || !currentUser) {
        if (!currentUser && typeof window.openLoginModal === 'function') {
          window.openLoginModal();
        }
        return;
      }
      
      spinning = true;
      document.getElementById('spinButton').disabled = true;
      
      const spinAngle = Math.random() * Math.PI * 2 + Math.PI * 8; // Минимум 4 полных оборота
      const duration = 4000; // 4 секунды
      const startTime = Date.now();
      const startRotation = currentRotation;
      
      function animate() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Easing функция для замедления
        const easeOut = 1 - Math.pow(1 - progress, 3);
        
        currentRotation = startRotation + spinAngle * easeOut;
        drawWheel();
        
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          spinning = false;
          document.getElementById('spinButton').disabled = false;
          showResult();
        }
      }
      
      animate();
      
      // Сохраняем результат в базу данных
      await saveSpinResult();
    }

    // Показ результата
    function showResult() {
      const normalizedRotation = currentRotation % (Math.PI * 2);
      const adjustedRotation = (Math.PI * 2 - normalizedRotation + Math.PI / 2) % (Math.PI * 2);
      const anglePerSegment = (Math.PI * 2) / wheelSegments.length;
      const winningIndex = Math.floor(adjustedRotation / anglePerSegment);
      const winner = wheelSegments[winningIndex];
      
      if (winner.value > 0) {
        document.getElementById('resultMessage').innerHTML = 
          `Вы выиграли <span class="text-2xl font-bold text-yellow-400">${winner.value} RGT</span>!`;
        
        // Обновляем статистику
        updateStats(winner.value);
        
        // Отправляем уведомление (если функция доступна)
        if (typeof window.sendNotification === 'function') {
          window.sendNotification('wheel_spin', `🎰 Вы выиграли ${winner.value} RGT на колесе фортуны!`);
        }
      } else {
        document.getElementById('resultMessage').innerHTML = 'Попробуйте еще раз!';
      }
      
      document.getElementById('resultModal').style.display = 'flex';
    }

    // Закрытие модального окна
    function closeResultModal() {
      document.getElementById('resultModal').style.display = 'none';
    }

    // Сохранение результата в базу данных
    async function saveSpinResult() {
      if (!db || !currentUser) return;
      
      try {
        const { collection, addDoc, serverTimestamp } = window.__firestoreExports;
        
        const normalizedRotation = currentRotation % (Math.PI * 2);
        const adjustedRotation = (Math.PI * 2 - normalizedRotation + Math.PI / 2) % (Math.PI * 2);
        const anglePerSegment = (Math.PI * 2) / wheelSegments.length;
        const winningIndex = Math.floor(adjustedRotation / anglePerSegment);
        const winner = wheelSegments[winningIndex];
        
        await addDoc(collection(db, 'wheel_spins'), {
          userId: currentUser.uid,
          result: winner.value,
          segment: winner.label,
          timestamp: serverTimestamp(),
          rotation: currentRotation
        });
        
        // Добавляем в джекпот
        if (winner.value > 0) {
          await addToJackpot(winner.value * 0.1); // 10% в джекпот
        }
        
      } catch (error) {
        console.error('Error saving spin result:', error);
      }
    }

    // Загрузка джекпота
    async function loadJackpot() {
      if (!db) return;
      
      try {
        const { doc, getDoc } = window.__firestoreExports;
        const jackpotDoc = await getDoc(doc(db, 'wheel_jackpot', 'current'));
        
        if (jackpotDoc.exists()) {
          jackpotData = jackpotDoc.data();
          document.getElementById('jackpotAmount').textContent = `${jackpotData.amount} RGT`;
          
          // Запускаем таймер
          startJackpotTimer();
        }
      } catch (error) {
        console.error('Error loading jackpot:', error);
      }
    }

    // Таймер джекпота
    function startJackpotTimer() {
      if (!jackpotData || !jackpotData.nextDraw) return;
      
      function updateTimer() {
        const now = new Date();
        const nextDraw = jackpotData.nextDraw.toDate();
        const diff = nextDraw - now;
        
        if (diff > 0) {
          const hours = Math.floor(diff / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);
          
          document.getElementById('jackpotTimer').textContent = 
            `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        } else {
          document.getElementById('jackpotTimer').textContent = 'Розыгрыш!';
          drawJackpotWinner();
        }
      }
      
      updateTimer();
      setInterval(updateTimer, 1000);
    }

    // Загрузка статистики
    async function loadStats() {
      if (!db) return;
      
      try {
        const { collection, getDocs, query, where, orderBy, limit } = window.__firestoreExports;
        
        // Общая статистика
        const totalSpinsQuery = query(
          collection(db, 'wheel_spins'),
          orderBy('timestamp', 'desc'),
          limit(1000)
        );
        
        const totalSnapshot = await getDocs(totalSpinsQuery);
        let totalSpins = 0;
        let totalWinnings = 0;
        
        totalSnapshot.forEach(doc => {
          totalSpins++;
          totalWinnings += doc.data().result || 0;
        });
        
        document.getElementById('totalSpins').textContent = totalSpins;
        document.getElementById('totalWinnings').textContent = totalWinnings + ' RGT';
        
        // Статистика пользователя
        if (currentUser) {
          const userSpinsQuery = query(
            collection(db, 'wheel_spins'),
            where('userId', '==', currentUser.uid),
            orderBy('timestamp', 'desc'),
            limit(100)
          );
          
          const userSnapshot = await getDocs(userSpinsQuery);
          let userSpins = 0;
          let userWinnings = 0;
          
          userSnapshot.forEach(doc => {
            userSpins++;
            userWinnings += doc.data().result || 0;
          });
          
          document.getElementById('yourSpins').textContent = userSpins;
          document.getElementById('yourWinnings').textContent = userWinnings + ' RGT';
        }
        
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }

    // Обновление статистики
    function updateStats(winnings) {
      const yourSpinsEl = document.getElementById('yourSpins');
      const yourWinningsEl = document.getElementById('yourWinnings');
      
      yourSpinsEl.textContent = parseInt(yourSpinsEl.textContent) + 1;
      yourWinningsEl.textContent = (parseInt(yourWinningsEl.textContent) + winnings) + ' RGT';
      
      const totalSpinsEl = document.getElementById('totalSpins');
      const totalWinningsEl = document.getElementById('totalWinnings');
      
      totalSpinsEl.textContent = parseInt(totalSpinsEl.textContent) + 1;
      totalWinningsEl.textContent = (parseInt(totalWinningsEl.textContent) + winnings) + ' RGT';
    }

    // Загрузка истории
    async function loadHistory() {
      if (!db) return;
      
      try {
        const { collection, getDocs, query, orderBy, limit } = window.__firestoreExports;
        
        const historyQuery = query(
          collection(db, 'wheel_spins'),
          orderBy('timestamp', 'desc'),
          limit(20)
        );
        
        const snapshot = await getDocs(historyQuery);
        const historyList = document.getElementById('historyList');
        
        if (snapshot.empty) {
          historyList.innerHTML = '<div class="text-center text-slate-500">История пуста</div>';
          return;
        }
        
        historyList.innerHTML = '';
        snapshot.forEach(doc => {
          const data = doc.data();
          const timeAgo = formatTimeAgo(data.timestamp.toDate());
          
          const historyItem = document.createElement('div');
          historyItem.className = 'bg-slate-800 rounded-lg p-4 flex justify-between items-center';
          historyItem.innerHTML = `
            <div>
              <div class="font-semibold">${data.segment}</div>
              <div class="text-sm text-slate-400">${timeAgo}</div>
            </div>
            <div class="text-lg font-bold ${data.result > 0 ? 'text-green-400' : 'text-slate-400'}">
              ${data.result > 0 ? '+' + data.result + ' RGT' : 'Попробуйте еще раз'}
            </div>
          `;
          
          historyList.appendChild(historyItem);
        });
        
      } catch (error) {
        console.error('Error loading history:', error);
      }
    }

    // Форматирование времени
    function formatTimeAgo(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      
      if (seconds < 60) return 'только что';
      if (seconds < 3600) return Math.floor(seconds / 60) + ' мин. назад';
      if (seconds < 86400) return Math.floor(seconds / 3600) + ' ч. назад';
      return Math.floor(seconds / 86400) + ' д. назад';
    }

    // Добавление в джекпот
    async function addToJackpot(amount) {
      if (!db) return;
      
      try {
        const { doc, updateDoc, increment } = window.__firestoreExports;
        
        await updateDoc(doc(db, 'wheel_jackpot', 'current'), {
          amount: increment(amount)
        });
        
        // Обновляем отображение
        if (jackpotData) {
          jackpotData.amount += amount;
          document.getElementById('jackpotAmount').textContent = `${jackpotData.amount} RGT`;
        }
        
      } catch (error) {
        console.error('Error adding to jackpot:', error);
      }
    }

    // Розыгрыш джекпота (заглушка)
    function drawJackpotWinner() {
      // Здесь будет логика розыгрыша джекпота
      console.log('Jackpot draw!');
    }

    // Слушаем изменения авторизации
    window.addEventListener('authStateChanged', function(user) {
      currentUser = user;
      updateAuthUI();
      
      if (user && db) {
        loadStats();
        if (typeof window.loadNotifications === 'function') {
          window.loadNotifications();
        }
      }
    });

    // Функция отправки уведомления (если нет централизованной)
    if (typeof window.sendNotification !== 'function') {
      window.sendNotification = function(type, message) {
        console.log('Notification:', type, message);
      };
    }
  </script>
</body>
</html>
