<!DOCTYPE html>
<html>
<head>
    <title>Stop Cycle</title>
</head>
<body>
    <h1>Остановка бесконечного цикла...</h1>
    <script>
        // Немедленно остановить все таймеры
        var highest = setTimeout(function(){}, 0);
        for(var i = 0; i < highest; i++) {
            clearTimeout(i); 
            clearInterval(i);
        }
        
        // Переход на основной сайт
        setTimeout(function() {
            window.location.href = './index.html';
        }, 1000);
    </script>
</body>
</html>
